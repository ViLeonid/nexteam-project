services:

  backend:
    build:
      context: ./server
    container_name: onolympus-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    volumes:
      - ./server/instance:/app/instance
    restart: always


  frontend:
    build:
      context: ./client
    container_name: onolympus-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always